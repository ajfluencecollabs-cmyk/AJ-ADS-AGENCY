<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJ Ads Agency | India's Most Trusted</title>
    <style>
        :root {
            /* Colors extracted directly from your logo */
            --logo-blue: #0093D8;
            --logo-green: #27B14B;
            --gradient-blue: linear-gradient(135deg, #0093D8, #00B4D8);
            --gradient-green: linear-gradient(135deg, #27B14B, #45C65F);
            --bg-white: #ffffff;
            --text-dark: #333333;
            --whatsapp-color: #25d366;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f7f6;
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 420px;
            text-align: center;
            padding: 40px 25px;
            background: var(--bg-white);
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0, 147, 216, 0.1);
            border: 1px solid #eef2f3;
        }

        .logo-box {
            width: 150px;
            margin: 0 auto 20px auto;
        }

        .logo-box img {
            width: 100%;
            height: auto;
            display: block;
        }

        h1 {
            font-size: 28px;
            margin: 10px 0;
            /* Applying the Blue from your logo to the main name */
            color: var(--logo-blue);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        .trusted-badge {
            display: inline-block;
            background: var(--gradient-green);
            color: white;
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .service-list {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 30px;
            border-left: 5px solid var(--logo-blue);
            text-align: left;
        }

        .service-list p {
            margin: 8px 0;
            font-size: 15px;
            font-weight: 600;
        }

        .service-list span {
            color: var(--logo-green); /* Green from logo for tick marks */
            margin-right: 8px;
        }

        .cta-button {
            display: block;
            background: var(--whatsapp-color);
            color: white;
            text-decoration: none;
            padding: 20px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(37, 211, 102, 0.2);
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(37, 211, 102, 0.3);
        }

        .guarantee {
            margin-top: 20px;
            font-size: 13px;
            color: var(--logo-blue);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-box">
            <img src="https://i.ibb.co/rRNfcvv9/logo.png" alt="AJ Ads Agency Logo">
        </div>
        
        <div class="trusted-badge">India's Most Trusted Agency</div>
        
        <h1>AJ ADS AGENCY</h1>
        
        <div class="service-list">
            <p><span>✔</span> Gambling Ads Specialist</p>
            <p><span>✔</span> Stock Market Research Groups</p>
            <p><span>✔</span> Colour Prediction Marketing</p>
            <p><span>✔</span> Casino & Gaming Traffic</p>
        </div>

        <a href="https://alvo.chat/7frC" class="cta-button">
            WHATSAPP FOR ADS SERVICE
        </a>

        <p class="guarantee">Guaranteed High Conversion & Results</p>
    </div>

</body>
</html>
